<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScamShield verdict</title>
<style>
  :root {
    --ink: #1b1b1f;
    --muted: #4a4a55;
    --paper: #fbfaf7;
    --line: #e4e1da;
    --scam: #b3261e;      --scam-bg: #fdecea;
    --warn: #8a5300;      --warn-bg: #fff4dc;
    --safe: #1d6b3a;      --safe-bg: #e7f5ec;
    --accent: var(--scam); --accent-bg: var(--scam-bg);
    --radius: 22px;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f3f2ee; --muted:#c6c3bb; --paper:#17171a; --line:#2c2c31;
      --scam-bg:#3a1512; --warn-bg:#3a2a0b; --safe-bg:#0f2e1b; --scam:#ff8a80; --warn:#ffc65c; --safe:#7ee0a2; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: transparent; color: var(--ink); }
  body[data-verdict="SUSPICIOUS"] { --accent: var(--warn); --accent-bg: var(--warn-bg); }
  body[data-verdict="LIKELY_SAFE"] { --accent: var(--safe); --accent-bg: var(--safe-bg); }

  .card { background: var(--paper); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  .hero { background: var(--accent-bg); padding: 22px 28px 20px; display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; border-bottom: 6px solid var(--accent); }
  .badge { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #fff; flex: none; }
  .badge svg { width: 46px; height: 46px; }
  .eyebrow { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--accent); margin: 0 0 6px; }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.08; margin: 0; font-weight: 850; letter-spacing: -.01em; }
  .summary { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.38; margin: 8px 0 0; color: var(--ink); }

  .body { padding: 18px 28px 20px; display: grid; gap: 14px; }
  .repeat { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-bg); border-radius: 14px; padding: 12px 16px; font-size: 17.5px; line-height: 1.35; font-weight: 650; }
  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; } .badge { width: 72px; height: 72px; } }

  h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 800; }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: 17.5px; line-height: 1.35; }
  ol.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 800; font-size: 17px; }

  .call { border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .call .org { font-size: 17px; color: var(--muted); font-weight: 700; }
  .call .phone { font-size: clamp(24px, 3.2vw, 30px); font-weight: 850; margin: 2px 0 2px; letter-spacing: .01em; white-space: nowrap; }
  .call .alias { font-size: 15px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .call .site { font-size: 17px; color: var(--muted); }
  .call .note { font-size: 16px; color: var(--muted); margin-top: 8px; line-height: 1.35; }

  .flags { display: flex; flex-wrap: wrap; gap: 8px; }
  .flag { border: 1.5px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 750; }

  .family { display: flex; align-items: center; justify-content: space-between; gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .family .status { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 0 5px color-mix(in srgb, var(--safe) 25%, transparent); }
  button { font: inherit; font-size: 18px; font-weight: 800; border: none; border-radius: 14px; padding: 14px 20px; background: var(--ink); color: var(--paper); cursor: pointer; min-height: 52px; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  .meta { font-size: 13px; color: var(--muted); }
  .hidden { display: none !important; }

  /* history mode */
  .hist { display: grid; gap: 10px; }
  .hist .row { display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; font-size: 18px; }
  .hist .row .pip { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body data-verdict="SCAM">
  <main class="card" id="card" aria-live="polite">
    <section class="hero">
      <div class="badge" id="badge" aria-hidden="true"></div>
      <div>
        <p class="eyebrow" id="eyebrow">ScamShield</p>
        <h1 id="title">Checking…</h1>
        <p class="summary" id="summary"></p>
      </div>
    </section>
    <section class="body">
      <div class="repeat hidden" id="repeat"><span aria-hidden="true">🔁</span><span id="repeatText"></span></div>
      <div class="hist hidden" id="hist"></div>
      <div class="grid" id="grid">
        <div>
          <h2>What to do</h2>
          <ol class="steps" id="steps"></ol>
        </div>
        <div style="display:grid; gap:16px; align-content:start">
          <div class="call hidden" id="call">
            <h2 style="margin-bottom:6px">Call the real number</h2>
            <div class="org" id="callOrg"></div>
            <div class="phone" id="callPhone"></div>
            <div class="alias" id="callAlias"></div>
            <div class="site" id="callSite"></div>
            <div class="note" id="callNote"></div>
          </div>
          <div id="flagsWrap" class="hidden">
            <h2>Warning signs</h2>
            <div class="flags" id="flags"></div>
          </div>
        </div>
      </div>
      <div class="family">
        <div class="status" id="familyStatus"></div>
        <button id="tellFamily" type="button">Tell my family</button>
      </div>
      <div class="meta" id="meta"></div>
    </section>
  </main>

<script>
(() => {
  const ICONS = {
    SCAM: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5"/><path d="M12 17.6v.01"/></svg>',
    SUSPICIOUS: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.9v.3"/><path d="M12 17.4v.01"/></svg>',
    LIKELY_SAFE: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 4 6v5.6c0 4.6 3.3 8.6 8 9.6 4.7-1 8-5 8-9.6V6l-8-3.2z"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg>',
  };
  const TITLES = { SCAM: "This is very likely a scam", SUSPICIOUS: "Be careful — this looks suspicious", LIKELY_SAFE: "No scam signs found" };
  const EYEBROW = { SCAM: "Stop · Don't share anything", SUSPICIOUS: "Pause · Check first", LIKELY_SAFE: "No common scam signs" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);

  // ── Minimal MCP Apps (SEP-1865) bridge over postMessage ───────────────────
  let nextId = 1; const pending = new Map();
  const send = (msg) => window.parent !== window && window.parent.postMessage(msg, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); send({ jsonrpc: "2.0", id, method, params });
    setTimeout(() => pending.has(id) && (pending.delete(id), reject(new Error("timeout"))), 15000);
  });
  const notify = (method, params) => send({ jsonrpc: "2.0", method, params });

  window.addEventListener("message", (e) => {
    const m = e.data; if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(m.error) : p.resolve(m.result); return;
    }
    if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent ?? {});
    if (m.method === "ui/notifications/host-context-changed" && m.params?.theme) document.documentElement.style.colorScheme = m.params.theme;
  });

  const reportSize = () => notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  new ResizeObserver(reportSize).observe(document.body);

  // ── Rendering ─────────────────────────────────────────────────────────────
  let current = {};
  function render(d) {
    current = d;
    if (d.incidents) return renderHistory(d);
    $("hist").classList.add("hidden"); $("grid").classList.remove("hidden");
    const v = d.verdict || "SUSPICIOUS";
    document.body.dataset.verdict = v;
    $("badge").innerHTML = ICONS[v];
    $("eyebrow").textContent = EYEBROW[v];
    $("title").textContent = TITLES[v];
    $("summary").textContent = d.summary || "";
    $("repeat").classList.toggle("hidden", !d.repeatNote);
    $("repeatText").textContent = d.repeatNote || "";
    $("steps").innerHTML = (d.nextSteps || []).map((s) => `<li><span>${esc(s)}</span></li>`).join("");

    const c = d.officialContact;
    $("call").classList.toggle("hidden", !c || v === "LIKELY_SAFE");
    if (c) {
      $("callOrg").textContent = c.name;
      const [num, alias] = (c.phone || "").split(/\s*\((.*)\)\s*$/);
      $("callPhone").textContent = num || "";
      $("callAlias").textContent = alias || "";
      $("callPhone").classList.toggle("hidden", !c.phone);
      $("callSite").textContent = c.website || "";
      $("callNote").textContent = c.howTheyContactYou || "";
    }
    const flags = (d.redFlags || []).filter((f) => f.id !== "impersonation" || d.redFlags.length > 1);
    $("flagsWrap").classList.toggle("hidden", !flags.length);
    $("flags").innerHTML = flags.map((f) => `<span class="flag" title="${esc(f.why)}">${esc(f.label)}</span>`).join("");

    setFamily(d.familyAlerted, d.trustedContactName);
    $("meta").textContent = `Risk ${d.riskScore ?? "–"}/100 · ${d.engine === "rules+bedrock" ? "Scam playbook + Amazon Bedrock" : "Scam playbook"} · personal numbers removed before analysis`;
    reportSize();
  }

  function setFamily(alerted, name) {
    const who = name || "your family";
    $("familyStatus").innerHTML = alerted ? `<span class="dot"></span>${esc(who)} has been told` : `Want ${esc(who)} to know?`;
    $("tellFamily").disabled = !!alerted;
    $("tellFamily").textContent = alerted ? "Sent ✓" : `Tell ${who}`;
  }

  $("tellFamily").addEventListener("click", async () => {
    $("tellFamily").disabled = true; $("tellFamily").textContent = "Sending…";
    try {
      await request("tools/call", { name: "alert_trusted_family", arguments: { note: "Sent from the ScamShield card." } });
      setFamily(true, current.trustedContactName);
    } catch {
      $("tellFamily").disabled = false; $("tellFamily").textContent = "Try again";
    }
  });

  function renderHistory(d) {
    document.body.dataset.verdict = d.suspiciousOrScam ? "SUSPICIOUS" : "LIKELY_SAFE";
    $("badge").innerHTML = ICONS[d.suspiciousOrScam ? "SUSPICIOUS" : "LIKELY_SAFE"];
    $("eyebrow").textContent = `Last ${d.days} days`;
    $("title").textContent = d.suspiciousOrScam ? `${d.suspiciousOrScam} suspicious contacts` : "All quiet";
    $("summary").textContent = Object.entries(d.byOrganization || {}).map(([o, n]) => `${n}× ${o}`).join(" · ");
    const color = { SCAM: "var(--scam)", SUSPICIOUS: "var(--warn)", LIKELY_SAFE: "var(--safe)" };
    $("grid").classList.add("hidden"); $("hist").classList.remove("hidden");
    $("hist").innerHTML = `${(d.incidents || []).map((i) =>
      `<div class="row"><span class="pip" style="background:${color[i.verdict]}"></span><span>${esc(i.claimedOrganization || "Unknown caller")} · ${esc(i.channel.replace("_"," "))}</span><span class="meta">${new Date(i.ts).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}</span></div>`).join("")}`;
    setFamily(false, d.trustedContactName);
    $("meta").textContent = `${d.total} contacts checked · remembered ${d.days} days · personal numbers never stored`;
    ["call", "flagsWrap", "repeat"].forEach((id) => $(id).classList.add("hidden"));
    reportSize();
  }

  // ── Handshake ─────────────────────────────────────────────────────────────
  if (window.parent !== window) {
    request("ui/initialize", {
      appInfo: { name: "scamshield-verdict-card", version: "1.0.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    }).then((r) => {
      if (r?.hostContext?.theme) document.documentElement.style.colorScheme = r.hostContext.theme;
      notify("ui/notifications/initialized", {});
    }).catch(() => {});
  } else {
    // Opened directly: show a sample so designers can iterate on the card.
    render({
      verdict: "SCAM", riskScore: 95, summary: "Medicare already has your number. They do not call to ask for it.",
      repeatNote: "This is the second time this week someone claimed to be Medicare.",
      nextSteps: ["Hang up. You don't owe them an explanation.", "Do not share any numbers or codes.", "If you're worried, call the official number on this screen yourself."],
      officialContact: { name: "Medicare", phone: "1-800-633-4227 (1-800-MEDICARE)", website: "medicare.gov", howTheyContactYou: "Medicare will not call you to ask for your Medicare number." },
      redFlags: [{ id: "asks_for_ids", label: "Asks for an ID or card number", why: "" }, { id: "urgency", label: "Pushes you to act right now", why: "" }],
      familyAlerted: true, trustedContactName: "Aiperi", engine: "rules",
    });
  }
})();
</script>
</body>
</html>
